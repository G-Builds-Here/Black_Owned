# NATS server config for the local dev stack.
# no_tls enables the plain ws:// transport the browser chat client (nats.ws)
# uses on port 8081. Local development only — production must use TLS.
#
# The http block is explicit: with a config file in use the default
# monitoring HTTP listener (8222) is not started unless requested, and the
# compose healthcheck probes http://localhost:8222/healthz.
websocket {
  port: 8081
  no_tls: true
}

http: 8222
