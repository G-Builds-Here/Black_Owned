[package]
name = "bw-ingestion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bw-types = { path = "../bw-types" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }
clickhouse = { version = "0.13", optional = true }
async-nats = { version = "0.40", optional = true }
minio-rsc = { version = "0.2.6", optional = true }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp"], optional = true }
image = { version = "0.25", features = ["jpeg", "png", "gif"], optional = true }
tracing = { version = "0.1" }
bytes = { version = "1.0", optional = true }
futures = { version = "0.3", optional = true }
lettre = { version = "0.11", features = ["tokio1-native-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
integration_test = ["tokio", "clickhouse", "async-nats", "minio-rsc", "redis", "image", "bytes", "futures"]
