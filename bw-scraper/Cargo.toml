[package]
name = "bw_scraper"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = ["scraper", "api", "importer"]
scraper = []
api = ["axum", "tokio/net"]
importer = ["sqlx"]
analytics = ["clickhouse"]
full = ["scraper", "api", "importer", "analytics"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Database (PostgreSQL) - optional via importer feature
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres"], optional = true }

# NATS JetStream messaging
async-nats = "0.33"

# HTTP API server - optional via api feature
axum = { version = "0.7", features = ["macros"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ClickHouse for analytics (optional)
clickhouse = { version = "0.12", optional = true }

# Playwright for web scraping (optional)
# Note: playwright-rs not available on crates.io; placeholder for future integration
# playwright = { version = "0.0.20", optional = true }
