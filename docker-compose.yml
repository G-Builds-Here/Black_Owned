services:
  bw-scraper:
    build:
      context: ./bw-scraper
      dockerfile: Dockerfile
    container_name: black-owned-bw-scraper
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://blackowned:password@postgres:5432/blackowned?sslmode=disable
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://valkey:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - RUST_LOG=info
    restart: unless-stopped
    networks:
      - black-owned-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: black-owned-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - black-owned-network

  nats:
    image: nats:2.10-alpine
    container_name: black-owned-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "-sl", "ping", "localhost:4222"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - black-owned-network

  minio:
    image: minio/minio:latest
    container_name: black-owned-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - black-owned-network

  postgres:
    image: postgres:15-alpine
    container_name: black-owned-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: blackowned
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blackowned
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackowned -d blackowned"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - black-owned-network

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: black-owned-valkey
    ports:
      - "6379:6379"
    command:
      - valkey-server
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--maxmemory"
      - "268435456"
      - "--timeout"
      - "300"
      - "--notify-keyspace-events"
      - "KEA"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - black-owned-network

networks:
  black-owned-network:
    driver: bridge

volumes:
  clickhouse-data:
  nats-data:
  minio-data:
  postgres-data:
  valkey-data:
