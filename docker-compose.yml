# Fixed project name: worktree checkouts must not spawn loc-* compose
# projects (fixed container_names collide across worktrees anyway).
# Must match the name compose infers from the directory (lowercased
# "Black_Owned") so existing containers/volumes stay recognized.
name: black_owned

services:
  bw-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: black-owned-bw-scraper
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NATS_URL=nats://nats:4222
      - REDIS_URL=valkey://valkey:6379
      - CLICKHOUSE_URL=clickhouse://clickhouse:8123
      - SEARXNG_URL=${SEARXNG_URL}
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: black-owned-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: black-owned-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  nats:
    image: nats:2.10-alpine
    container_name: black-owned-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: black-owned-minio
    # Host ports 9002/9003: 9000 was double-mapped with clickhouse,
    # which keeps its canonical native port.
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: black-owned-valkey
    ports:
      - "6379:6379"
    command:
      - valkey-server
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--maxmemory"
      - "268435456"
      - "--timeout"
      - "300"
      - "--notify-keyspace-events"
      - "KEA"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  clickhouse-data:
  nats-data:
  minio-data:
  valkey-data:
  postgres-data:
